name: QuarkDrive checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Go tests and race detector
        working-directory: backend
        run: go test -race -count=1 ./...
      - name: Validate embedded frontend JS
        run: node --check frontend/assets/app.js && node --check frontend/assets/file-pages.js && node --check frontend/assets/qr.js
      - name: Go vet
        working-directory: backend
        run: go vet ./...
      - name: Theme tests and fnOS source contracts
        run: node --test tests/theme.test.cjs tests/file-pages.test.cjs && python3 scripts/audit-fpk.py --source && python3 tests/packaging_test.py
      - name: Cross-compile Linux binaries
        run: bash scripts/build.sh
      - name: Upload binaries (not official FPK)
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: build/bin/*
